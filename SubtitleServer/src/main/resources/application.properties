spring.application.name=SubtitleServer
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=32
server.tomcat.max-connections=64

# Limit each encoded chunk, rather than accepting a whole unbounded media file.
spring.servlet.multipart.max-file-size=24MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=0

transcription.base-url=https://api.openai.com/v1
transcription.api-key=${OPENAI_API_KEY:}
transcription.connect-timeout-seconds=10
transcription.read-timeout-seconds=120

# Relative to the server working directory. Store transcripts and usage, never original audio.
subtitles.store-file=${SUBTITLE_STORE_FILE:./data/subtitles.json}
subtitles.cache-max-entries=256
