<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Transcriber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css"/>
    </head>
<body>
<main class="console">
    <h1>Transcriber</h1>
    <p id="status" role="status" aria-live="polite">Ready</p>

    <button id="record-button" class="record-button" aria-pressed="false">
        <span class="record-button__ring" aria-hidden="true"></span>
        <span class="record-button__icon" aria-hidden="true"></span>
        <span id="record-label" class="sr-only">Start recording</span>
    </button>
    <p id="timer" class="timer">00:00</p>

    <div id="error" class="error" role="alert" hidden></div>

    <p id="transcript" class="transcript" aria-live="polite">Your transcript will appear here.</p>
</main>

<script src="app.js" defer></script>
</body>
</html>
